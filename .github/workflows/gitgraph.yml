name: generate git graph

# Controls when the workflow will run
on:
  # Triggers the workflow on push events and only for the main branch
  push:
    branches: [main]
  schedule:
    - cron: "5 7 * * */2" # every two days at 7:05am UTC

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

  repository_dispatch: # run workflow on api request

# prevent concurrent jobs
concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: clone this repo
        run: git clone https://github.com/${{ github.repository }}.git "git-graph"

      - name: clone remote repo
        run: git clone https://codeberg.org/Starfish/TinyWeatherForecastGermany.git git-graph/TinyWeatherForecastGermany

      # deactivated due to ongoing issues
      # - name: update apt packages
      #   run: timeout 120s sudo apt update || true

      # - name: upgrade apt packages
      #   run: timeout 120s sudo apt upgrade -y || true

      - name: Setup Python 3.x
        uses: actions/setup-python@v7
        with:
          python-version: 3.12

      - name: install uv
        uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - name: install graphviz
        run: sudo apt-get update && sudo apt-get install -y graphviz

      - name: sync dependencies
        run: uv sync --locked --all-groups
        working-directory: git-graph

      - name: check code quality and tests
        run: |
          uv run black --check __init__.py git_log2graphviz.py tests
          uv run flake8 __init__.py git_log2graphviz.py tests
          uv run bandit -r __init__.py git_log2graphviz.py
          uv run pytest
        working-directory: git-graph

      - name: fetch and integrate repository forks
        run: uv run --no-sync python __init__.py
        working-directory: git-graph

      - name: generate git graph using Python and graphviz
        run: uv run --no-sync python git_log2graphviz.py
        working-directory: git-graph

      - name: archive generated svg
        uses: actions/upload-artifact@v7
        with:
          name: generated-svg
          path: |
            git-graph/git_graph.svg
            git-graph/git_graph.dot

      - name: git commit and push
        run: |
          cd git-graph
          git config --local user.name eUgEntOptIc44
          git config --local user.email eUgEntOptIc@outlook.de
          git checkout --orphan pages
          git reset
          git add *.svg
          git add *.dot || true
          git add README.md || true
          git commit -m "update git graph"
          git remote add github-pages "https://${{ github.repository_owner }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push -u -f github-pages
